# taksitci-site reposuna .github/workflows/logos.yml olarak kopyalanır.
# Betik ve katalog site reposunda tools/logos/ altında durur (bu repodaki scripts/logos/ ve
# Taksitci/Resources/BankCatalog.json ile aynı dosyalar; katalog tools/logos/BankCatalog.json olur).
name: Banka logo paketi

on:
  schedule:
    # Ayda bir (ayın 5'i): App Store ikonları nadiren değişir.
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      check:
        description: "Yalnızca kontrol: indir ve doğrula, dosya yazma (ana branch dışında hep böyle)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow
      - name: Paketi indir ve doğrula
        run: |
          python3 tools/logos/build_logo_pack.py \
            --catalog tools/logos/BankCatalog.json \
            --out data/logos.json \
            ${{ (inputs.check || github.ref != 'refs/heads/main') && '--check' || '' }}
      - name: Değiştiyse commit et
        if: ${{ !inputs.check && github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- data/logos.json && [ -z "$(git ls-files --others --exclude-standard -- data/logos.json)" ]; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logos.json
          git commit -m "Banka logo paketi güncellendi"
          git push
